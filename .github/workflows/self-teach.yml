name: SKA Self-Teach (King Infinity — Forever Learning Engine)

on:
  schedule:
    - cron: '15 8 * * *'    # 1x daily — throttled to fit the 2000 min/mo free tier
  workflow_dispatch:

jobs:
  teach:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: King Infinity — autonomously author and deepen curriculum
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DB_ID: ${{ secrets.TEMPORAL_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: |
          cat > /tmp/teach.js <<'JS'
          const ACCT = process.env.CF_ACCOUNT_ID, DB = process.env.D1_DB_ID;
          const CF = process.env.CF_API_TOKEN;
          const GEM = process.env.GEMINI_API_KEY, GHM = process.env.GH_MODELS_TOKEN;
          const BATCH = 8;  // throttled: 8 subjects/run x 1 run/day = 240 subjects/mo within free-tier minutes

          async function d1(sql) {
            const r = await fetch(`https://api.cloudflare.com/client/v4/accounts/${ACCT}/d1/database/${DB}/query`, {
              method: "POST", headers: { "Authorization": `Bearer ${CF}`, "Content-Type": "application/json" },
              body: JSON.stringify({ sql }) });
            return r.json();
          }

          // THREE-LANE LLM: GitHub Models -> Gemini -> (skip). The forever-engine keeps working
          // as long as ANY lane has quota, instead of stalling when one is exhausted.
          async function githubModels(prompt) {
            if (!GHM) return null;
            try {
              const r = await fetch("https://models.github.ai/inference/chat/completions", {
                method: "POST", headers: { "Authorization": `Bearer ${GHM}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "openai/gpt-4.1-mini", messages: [{role:"user",content:prompt}], max_tokens: 2048, temperature: 0.4 }) });
              if (!r.ok) return null;
              const d = await r.json();
              return d?.choices?.[0]?.message?.content || null;
            } catch { return null; }
          }
          async function gemini(prompt) {
            if (!GEM) return null;
            try {
              const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${GEM}`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }], generationConfig: { maxOutputTokens: 2048, temperature: 0.4 } }) });
              if (!r.ok) return null;
              const d = await r.json();
              const p = d?.candidates?.[0]?.content?.parts;
              return Array.isArray(p) ? p.map(x => x.text || "").join("") : null;
            } catch { return null; }
          }
          async function generate(prompt) {
            // Try GitHub Models first (larger daily allowance), then Gemini
            return (await githubModels(prompt)) || (await gemini(prompt));
          }

          (async () => {
            const q = await d1(`SELECT key, length(data) as len FROM ska_knowledge WHERE length(data) < 1500 AND key NOT LIKE '%_L%' AND key != 'web_learned' ORDER BY length(data) ASC LIMIT ${BATCH}`);
            const rows = q?.result?.[0]?.results || [];
            if (!rows.length) { console.log("Forever-engine: knowledge base is deep across all subjects. Nothing shallow remains this cycle."); return; }
            console.log(`King Infinity targets (${rows.length}): ${rows.map(r => r.key).join(", ")}`);

            let taught = 0, laneFails = 0;
            for (const row of rows) {
              const subj = row.key.replace(/_/g, " ");
              const prompt = `Write a dense, expert-level teaching reference for "${subj}" (~3000 chars). Structure: FOUNDATIONS (core definition, first principles), then 5-7 named sections each with a real framework/method/formula and specifics (names, numbers, steps — never generic filler), then MASTERY LEVELS L1-L8 (one concrete line each, beginner to grandmaster). World-class textbook quality. Output only content, format "SECTION: text".`;
              const content = await generate(prompt);
              if (!content) { laneFails++; if (laneFails >= 3) { console.log("All LLM lanes exhausted — stopping cleanly, will resume next cycle."); break; } continue; }
              if (content.length < 900) { console.log(`  ${row.key}: too thin, skipped`); continue; }
              const esc = content.replace(/'/g, "''");
              const up = await d1(`UPDATE ska_knowledge SET data='${esc}' WHERE key='${row.key}'`);
              if (up?.success) { taught++; console.log(`  ${row.key}: taught (${content.length} chars, was ${row.len})`); }
              await new Promise(r => setTimeout(r, 1500));
            }
            console.log(`\nKING INFINITY CYCLE COMPLETE: ${taught}/${rows.length} subjects deepened. The engine learns forever.`);
          })();
          JS
          node /tmp/teach.js
