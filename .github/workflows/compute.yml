name: SKA Compute Plane (L2)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Pre-Compute + Shadow Validation (runner-side, zero Cloudflare CPU)
        run: |
          cat > /tmp/compute.js <<'JS'
          // SKA GitHub-L2 Compute Plane — pre-compute prediction batch + shadow post-compute audit.
          // All math midnight-genesis anchored (2018-07-01T00:00:00Z = 1530403200000 ms).
          const GENESIS_MS = 1530403200000;
          const now = Date.now();
          const beats = Math.floor((now - GENESIS_MS) / 1000);
          const t16 = (d => {
            const p = (n, w) => String(n).padStart(w, "0");
            return p(d.getUTCMonth() + 1, 2) + p(d.getUTCDate(), 2) + p(d.getUTCFullYear(), 4) +
                   p(d.getUTCHours(), 2) + p(d.getUTCMinutes(), 2) + p(d.getUTCSeconds(), 2) +
                   p(Math.floor(d.getUTCMilliseconds() / 10), 2);
          })(new Date(now));

          // PRE-COMPUTE: 26-lane prediction batch — one horizon per agent lane (3h offsets)
          const predictions = [];
          for (let lane = 0; lane < 26; lane++) {
            const horizonMs = ((lane % 8) + 1) * 3 * 3600 * 1000; // 3h→24h hardening ladder, cycling per spec
            const target = now + horizonMs;
            predictions.push({
              lane,
              agentDna16: "07012018120000" + String(lane + 1).padStart(2, "0"),
              type: "SLOT_FORECAST",
              targetTs: target,
              predictedBeats: Math.floor((target - GENESIS_MS) / 1000),
              predictedSlot: Math.floor((target - GENESIS_MS) / 1000),
              createdT16: t16,
              status: "ACTIVE",
              expires: target + 3600 * 1000
            });
          }

          // SHADOW POST-COMPUTE: validate prior batch against realized clock (deterministic audit)
          const fs = require("fs");
          let prior = null;
          try { prior = JSON.parse(process.env.PRIOR_STATE || "null"); } catch (e) {}
          let validations = 0, anomalies = 0;
          if (prior && Array.isArray(prior.predictions)) {
            for (const p of prior.predictions) {
              if (p.targetTs <= now) {
                const realized = Math.floor((p.targetTs - GENESIS_MS) / 1000);
                if (realized === p.predictedBeats) validations++; else anomalies++;
              }
            }
          }

          const state = {
            plane: "GITHUB_L2_COMPUTE",
            beats, t16,
            predictions,
            shadow: { validations, anomalies, auditedAt: now },
            runner: process.env.GITHUB_RUN_ID || "manual",
            ts: now
          };
          fs.writeFileSync("/tmp/state.json", JSON.stringify({ key: "compute:l2:state", value: state, ttl: 7200 }));
          console.log("computed", predictions.length, "predictions | beats:", beats, "| shadow:", validations, "/", anomalies);
          JS
          PRIOR=$(curl -s --max-time 20 "https://sales-king-academy.saleskingacademy.workers.dev/api/state/read?key=compute:l2:state" 2>/dev/null || echo "null")
          PRIOR_STATE="$PRIOR" node /tmp/compute.js

      - name: Ship results to state plane (KV)
        run: |
          curl -s --max-time 30 -X POST "https://sales-king-academy.saleskingacademy.workers.dev/api/state/write" \
            -H "Content-Type: application/json" \
            -H "X-Heartbeat-Key: ska-heartbeat-2018" \
            --data @/tmp/state.json -o /tmp/write.json
          cat /tmp/write.json
          grep -q '"success": *true' /tmp/write.json || (echo "STATE WRITE FAILED" && cat /tmp/write.json && exit 1)
