name: SKA Knowledge Accelerator (Free-Lane Rapid Learning)

on:
  schedule:
    - cron: '5 */4 * * *'   # twice hourly - fills knowledge base fast on free GitHub compute
  workflow_dispatch:

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Rapid knowledge generation via free LLM lanes (GitHub Models -> Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: |
          cat > /tmp/learn.mjs <<'JS'
          import fs from "fs";
          const GEM = process.env.GEMINI_API_KEY, GHM = process.env.GH_MODELS_TOKEN;

          // FREE LANE CASCADE: GitHub Models (gpt-4.1-mini) -> Gemini flash. Both free, generous.
          async function githubModels(prompt) {
            if (!GHM) return null;
            try {
              const r = await fetch("https://models.github.ai/inference/chat/completions", {
                method: "POST", headers: { "Authorization": `Bearer ${GHM}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "openai/gpt-4.1-mini", messages: [{role:"user",content:prompt}], max_tokens: 1200, temperature: 0.4 }) });
              if (!r.ok) return null;
              const d = await r.json();
              return d?.choices?.[0]?.message?.content || null;
            } catch { return null; }
          }
          async function gemini(prompt) {
            if (!GEM) return null;
            try {
              const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${GEM}`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ role:"user", parts:[{text:prompt}] }], generationConfig:{ maxOutputTokens:1200, temperature:0.4 } }) });
              if (!r.ok) return null;
              const d = await r.json();
              return d?.candidates?.[0]?.content?.parts?.[0]?.text || null;
            } catch { return null; }
          }
          async function gen(prompt) { return (await githubModels(prompt)) || (await gemini(prompt)); }

          // Rapid-learning targets: common business/sales/education Q&A the platform should
          // answer WITHOUT an LLM at chat time. Each becomes a permanent det_knowledge entry.
          const SEED_QUESTIONS = [
            "How do I handle the price objection in a sales call?",
            "What is the best way to open a cold call?",
            "How do I follow up after a sales demo without being pushy?",
            "What is consultative selling and how does it work?",
            "How do I qualify a lead using BANT?",
            "What are the stages of a typical B2B sales funnel?",
            "How do I write a cold email that gets replies?",
            "What is the difference between marketing and sales?",
            "How do I calculate customer lifetime value?",
            "What is a value proposition and how do I create one?",
            "How do I negotiate price without discounting?",
            "What is social selling and how do I do it on LinkedIn?",
            "How do I build rapport with a prospect quickly?",
            "What are the most common closing techniques in sales?",
            "How do I handle a prospect who says 'I need to think about it'?",
            "What is a sales pipeline and how do I manage one?",
            "How do I upsell existing customers effectively?",
            "What metrics should I track for sales performance?",
            "How do I create urgency without being manipulative?",
            "What is the SPIN selling method?"
          ];

          // v25.98: human emotional + cognitive pattern knowledge bank
          const EMOTIONAL_COGNITIVE = [
            "How do you recognize when someone is feeling anxious versus excited?",
            "What are the physical and verbal signs that a person feels defensive?",
            "How does active listening change the emotional state of the speaker?",
            "What emotional needs drive most human decision-making?",
            "How do you de-escalate someone who is angry or frustrated?",
            "What is emotional mirroring and how does it build connection?",
            "How does the brain process fear versus trust in social situations?",
            "What are the core human emotions and how do they manifest behaviorally?",
            "How do you read emotional subtext in written messages?",
            "What cognitive biases most affect how people perceive others?",
            "How does empathy differ from sympathy in practice?",
            "What behavioral patterns indicate someone feels heard and respected?",
            "How do stress and emotion affect decision-making and memory?",
            "What is the difference between reactive and reflective emotional responses?",
            "How do you build psychological safety in a conversation?",
            "What signals show someone is building or losing trust?",
            "How does tone of voice communicate emotion beyond words?",
            "What are healthy versus unhealthy ways people cope with rejection?",
            "How does the nervous system respond to feeling understood?",
            "What patterns distinguish genuine confidence from insecurity?"
          ];
          // three banks now: rotate across all of them so the base fills broadly + fast
          const ALL_BANKS = SEED_QUESTIONS.concat(EMOTIONAL_COGNITIVE);
          const totalSlices = Math.ceil(ALL_BANKS.length / 10);
          const runIdx = Math.floor(Date.now() / (30*60*1000)) % totalSlices;
          const slice = ALL_BANKS.slice(runIdx*10, runIdx*10+10);

          const learned = [];
          for (const q of slice) {
            const prompt = `You are an expert educator in sales, psychology, and human emotional intelligence. Answer this concisely and practically in about 160 words with specific, actionable, evidence-based guidance grounded in established behavioral science. Only factual, well-supported advice. Question: ${q}`;
            const answer = await gen(prompt);
            if (answer && answer.length > 60) learned.push({ q, a: answer.substring(0, 1800) });
          }

          const payload = {
            key: "search:knowledge_accelerator",
            value: {
              engine: "FREE_LANE_RAPID_LEARNING",
              generated: learned.length,
              entries: learned,
              ranAt: new Date().toISOString()
            },
            ttl: 604800
          };
          console.log("knowledge accelerator: generated", learned.length, "entries via free lanes");
          fs.writeFileSync("/tmp/klearn.json", JSON.stringify(payload));
          JS
          node /tmp/learn.mjs

      - name: Ingest learned knowledge into the base (workers.dev bypasses bot challenge)
        run: |
          curl -s --max-time 30 -X POST "https://sales-king-academy.saleskingacademy.workers.dev/api/knowledge/ingest" \
            -H "Content-Type: application/json" \
            -H "X-Heartbeat-Key: ska-heartbeat-2018" \
            --data @/tmp/klearn.json | head -c 300
          echo "  [knowledge ingested]"
