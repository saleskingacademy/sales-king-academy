name: SKA Beat Fan-out

# 1 second = 1 beat. The platform's cascade schedules the work; this job keeps
# the beat and fires every lane due on a beat at the same instant, each on its
# own Cloudflare isolate. Idle beats send nothing. Public repo: Actions minutes
# are unlimited, so jobs chain back-to-back (concurrency queues the next one).
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      run_minutes:
        description: 'Minutes to run (max 330)'
        required: false
        default: '300'
      budget:
        description: 'Max requests this run'
        required: false
        default: '8000'

concurrency:
  group: beat-fanout
  cancel-in-progress: false

jobs:
  fanout:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Run beat fan-out
        env:
          SKA_WORKER_URL: https://saleskingacademy.com
          SKA_HEARTBEAT_KEY: ${{ secrets.SKA_HEARTBEAT_KEY }}
          RUN_MINUTES: ${{ github.event.inputs.run_minutes || '300' }}
          DAILY_REQUEST_BUDGET: ${{ github.event.inputs.budget || '8000' }}
        run: python3 tools/beat_fanout.py
